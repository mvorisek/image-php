name: CI

on:
  pull_request:
  push:
  schedule:
    - cron: '20 2 1,15 * *'

jobs:
  unit:
    name: Templating
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mvorisek/image-php
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Check if files are in-sync"
        run: |
          rm -r data/
          php make.php
          git add . -N && git diff --exit-code

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      REGISTRY_NAME: ghcr.io
      REGISTRY_IMAGE_NAME: ghcr.io/${{ github.repository }}
    strategy:
      fail-fast: false
      matrix:
        imageName:
          - "7.4-alpine"
          - "7.4-zts-alpine"
          - "7.4-debug-alpine"
          - "8.0-alpine"
          - "8.0-zts-alpine"
          - "8.0-debug-alpine"
          - "8.1-alpine"
          - "8.1-zts-alpine"
          - "8.1-debug-alpine"
          - "8.2-alpine"
          - "8.2-zts-alpine"
          - "8.2-debug-alpine"
          - "8.3-alpine"
          - "8.3-zts-alpine"
          - "8.3-debug-alpine"
          - "8.4-alpine"
          - "8.4-zts-alpine"
          - "8.4-debug-alpine"
          - "8.5-alpine"
          - "8.5-zts-alpine"
          - "8.5-debug-alpine"
          - "7.4-debian"
          - "7.4-zts-debian"
          - "7.4-debug-debian"
          - "8.0-debian"
          - "8.0-zts-debian"
          - "8.0-debug-debian"
          - "8.1-debian"
          - "8.1-zts-debian"
          - "8.1-debug-debian"
          - "8.2-debian"
          - "8.2-zts-debian"
          - "8.2-debug-debian"
          - "8.3-debian"
          - "8.3-zts-debian"
          - "8.3-debug-debian"
          - "8.4-debian"
          - "8.4-zts-debian"
          - "8.4-debug-debian"
          - "8.5-debian"
          - "8.5-zts-debian"
          - "8.5-debug-debian"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 'Build helper image - build - 7.4.x'
        if: (matrix.imageName == '7.4-alpine' || matrix.imageName == '7.4-zts-alpine' || matrix.imageName == '7.4-debug-alpine' || matrix.imageName == '7.4-debian' || matrix.imageName == '7.4-zts-debian' || matrix.imageName == '7.4-debug-debian')
        # try to build twice to suppress random network issues with Github Actions
        run: >-
          if [ "${{ matrix.imageName }}" == "7.4-alpine" ]; then
          (docker build --target "patched-dlphp" -t "ci-target:patched-dlphp" -f data/7.4-alpine/Dockerfile ./
          || docker build --target "patched-dlphp" -t "ci-target:patched-dlphp" -f data/7.4-alpine/Dockerfile ./)
          ; elif [ "${{ matrix.imageName }}" == "7.4-zts-alpine" ]; then
          (docker build --target "patched-dlphp" -t "ci-target:patched-dlphp" -f data/7.4-zts-alpine/Dockerfile ./
          || docker build --target "patched-dlphp" -t "ci-target:patched-dlphp" -f data/7.4-zts-alpine/Dockerfile ./)
          ; elif [ "${{ matrix.imageName }}" == "7.4-debug-alpine" ]; then
          (docker build --target "patched-dlphp" -t "ci-target:patched-dlphp" -f data/7.4-debug-alpine/Dockerfile ./
          || docker build --target "patched-dlphp" -t "ci-target:patched-dlphp" -f data/7.4-debug-alpine/Dockerfile ./)
