          || docker build --target "patched-dlphp" -t "ci-target:patched-dlphp" -f data/8.3-zts-alpine/Dockerfile ./)
          ; elif [ "${{ matrix.imageName }}" == "8.3-debug-alpine" ]; then
          (docker build --target "patched-dlphp" -t "ci-target:patched-dlphp" -f data/8.3-debug-alpine/Dockerfile ./
          || docker build --target "patched-dlphp" -t "ci-target:patched-dlphp" -f data/8.3-debug-alpine/Dockerfile ./)
          ; elif [ "${{ matrix.imageName }}" == "8.3-debian" ]; then
          (docker build --target "patched-dlphp" -t "ci-target:patched-dlphp" -f data/8.3-debian/Dockerfile ./
          || docker build --target "patched-dlphp" -t "ci-target:patched-dlphp" -f data/8.3-debian/Dockerfile ./)
