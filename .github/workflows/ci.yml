          || docker build --target "patched-dlphp" -t "ci-target:patched-dlphp" -f data/7.4-debian/Dockerfile ./)
          ; elif [ "${{ matrix.imageName }}" == "7.4-zts-debian" ]; then
          (docker build --target "patched-dlphp" -t "ci-target:patched-dlphp" -f data/7.4-zts-debian/Dockerfile ./
          || docker build --target "patched-dlphp" -t "ci-target:patched-dlphp" -f data/7.4-zts-debian/Dockerfile ./)
          ; elif [ "${{ matrix.imageName }}" == "7.4-debug-debian" ]; then
          (docker build --target "patched-dlphp" -t "ci-target:patched-dlphp" -f data/7.4-debug-debian/Dockerfile ./
          || docker build --target "patched-dlphp" -t "ci-target:patched-dlphp" -f data/7.4-debug-debian/Dockerfile ./)
